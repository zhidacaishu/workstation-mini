<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Workstation Mini 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body data-settings-state="loading">
  <aside class="sidebar">
    <div class="identity">
      <span class="mark" aria-hidden="true"><svg viewBox="163 172 680 680"><rect class="mark-back" x="225" y="176" width="440" height="560" rx="72" transform="rotate(22 297 664)"/><rect class="mark-front" x="225" y="176" width="440" height="560" rx="72"/><path class="mark-tick" d="M327 462 L417 552 L581 368"/></svg></span>
      <div><strong>科研工作台</strong><small>本机设置</small></div>
    </div>
    <nav aria-label="设置分组" data-settings-nav>
      <a href="#workspace">工作区</a>
      <a href="#appearance">外观</a>
      <a href="#sync">同步</a>
      <a href="#system">系统</a>
    </nav>
  </aside>

  <main>
    <header class="page-header">
      <div>
        <h1>设置</h1>
      </div>
      <div class="status-stack" aria-label="设置状态">
        <span id="runtime-status" class="status-pill" hidden>正在读取…</span>
      </div>
    </header>

    <form id="settings-form" aria-busy="true">
      <section id="workspace" class="settings-section">
        <div class="section-heading"><div><h2>工作区</h2></div></div>
        <label class="field wide">
          <span>资料库目录</span>
          <div class="path-control"><input name="vaultDir" type="text" autocomplete="off" required><button type="button" data-choose-dir="vaultDir">选择</button></div>
        </label>
        <div class="field-grid">
          <label class="field"><span>设备名</span><input name="device" type="text" autocomplete="off"><small>用于区分不同设备的复习记录，首次启动时自动生成，不能留空。多台设备不要用同一个名字。</small></label>
          <label class="toggle"><input name="readOnly" type="checkbox"><span><strong>只读模式</strong><small>允许浏览、搜索和复习，阻止修改 Markdown。</small></span></label>
        </div>
        <div class="recovery-entry"><div><strong>从备份恢复到新资料库</strong><p>当前资料库和备份均不会修改。</p></div><button type="button" id="open-recovery">开始恢复…</button></div>
      </section>

      <section id="appearance" class="settings-section">
        <div class="section-heading"><div><h2>外观</h2></div></div>
        <fieldset class="theme-switch">
          <legend class="visually-hidden">主题</legend>
          <label><input type="radio" name="theme" value="system"><span>跟随系统</span></label>
          <label><input type="radio" name="theme" value="light"><span>浅色</span></label>
          <label><input type="radio" name="theme" value="dark"><span>深色</span></label>
        </fieldset>
      </section>

      <section id="sync" class="settings-section">
        <div class="section-heading"><div><h2>Git 同步</h2><p>资料库必须是 Git 工作树的根目录；否则自动跳过，不影响本地使用。</p></div></div>
        <div class="field-grid">
          <label class="toggle"><input name="syncEnabled" type="checkbox"><span><strong>启用自动同步</strong><small>每轮先提交本机修改，再拉取、推送。发生 Git 冲突时会停止同步，保留冲突现场，不自动选边。可以在下面逐个文件选保留远端还是本机的版本，也可以中止当前 Git 操作。</small></span></label>
          <label class="field"><span>同步间隔（分钟）</span><input name="syncIntervalMinutes" type="number" min="1" max="1440" step="1" required></label>
        </div>
        <div class="sync-status" id="sync-status" data-phase="disabled">
          <div><strong id="sync-status-title">自动同步已关闭</strong><p id="sync-status-detail">本地编辑和索引不受影响。</p></div>
          <button type="button" class="secondary" id="abort-git-operation" hidden>中止当前 Git 操作…</button>
        </div>
        <div class="conflict-panel" id="conflict-panel" hidden>
          <div class="conflict-head">
            <div><strong>两台设备改了同一个文件</strong><p id="conflict-note">逐个选保留哪一边。未采用的笔记和卡组版本会存进「历史与草稿」。附件等其他文件会被所选版本覆盖。</p></div>
            <div class="conflict-bulk"><button type="button" class="secondary small" id="conflict-all-remote">全部用远端</button><button type="button" class="secondary small" id="conflict-all-local">全部用本机</button></div>
          </div>
          <ul class="conflict-list" id="conflict-list"></ul>
          <div class="conflict-actions"><button type="button" class="primary" id="resolve-conflicts" disabled>按选择解决并继续同步</button><span id="conflict-progress"></span></div>
        </div>
        <button type="button" class="secondary" id="sync-now">立即同步</button>
      </section>

      <section id="system" class="settings-section">
        <div class="section-heading"><div><h2>系统</h2><p>关闭主窗口时应用会隐藏，仍可从系统托盘或菜单栏恢复。</p></div></div>
        <div data-capability="launchAtLogin">
          <label class="toggle"><input name="launchAtLogin" type="checkbox"><span><strong>登录 Windows 后启动</strong><small>默认关闭；启用后会静默启动到托盘。</small></span></label>
        </div>
        <div class="button-row"><button type="button" class="secondary" id="open-vault">打开资料库</button><button type="button" class="secondary" id="open-config">打开配置目录</button></div>
      </section>

      <footer class="save-bar">
        <p id="message" role="status" aria-live="polite"></p>
        <button type="button" class="secondary" id="reload-settings" hidden>载入外部设置</button>
        <button type="submit" class="primary" id="save" disabled>保存设置</button>
      </footer>
    </form>
  </main>
  <script src="settings.js" defer></script>
</body>
</html>
