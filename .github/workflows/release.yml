name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require version tag matching package metadata
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_REF!=="refs/tags/v"+p.version) throw Error("Release must run on the matching version tag"); const lock=require("./package-lock.json"); if(lock.version!==p.version || lock.packages[""].version!==p.version) throw Error("Lockfile version mismatch");'
  regression:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          npx playwright-core install-deps chromium
      - run: npm test
  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:build
      - name: Locate packaged executable
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path 'dist/win-unpacked' -Filter '*.exe' -File)
          if ($executables.Count -ne 1) { throw 'Expected one packaged executable' }
          "WORKSTATION_EXECUTABLE=$($executables[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/workstation-mini-*-setup.exe
          if-no-files-found: error
          retention-days: 3
  macos:
    needs: validate
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run desktop:build:mac
      - name: Verify package and locate executable
        run: echo "WORKSTATION_EXECUTABLE=$(npm run --silent verify-mac-package)" >> "$GITHUB_ENV"
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/workstation-mini-*-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [regression, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: release-assets
          merge-multiple: true
      - name: Publish verified installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.exe ./*.dmg SHA256SUMS.txt --verify-tag --title "Workstation Mini $RELEASE_TAG" --notes-file ../docs/RELEASE-0.2.0.md
